name: Run Lint Test and Formatting Scripts

on:
  pull_request:
    branches:
      - main

jobs:
  runChecks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm ci

      - name: Run tests and capture output
        run: |
          echo "Running tests...."
          npm run test | tee test-output.txt
          echo "Test completed!!"

      - name: Run linting
        run: |
          npm run lint | tee lint-output.txt

      - name: Run code formatting check
        run: |
          npm run format | tee format-output.txt

      - name: Aggregate results and post comment
        run: |
          set -e

          # Read outputs
          TEST_RESULTS=$(cat test-output.txt)
          LINT_RESULTS=$(cat lint-output.txt)
          FORMAT_RESULTS=$(cat format-output.txt)

          # Extract summaries
          TEST_SUMMARY=$(echo "$TEST_RESULTS" | grep -E 'Tests:.*' || echo "Uh oh, Something Happened :/")
          LINT_SUMMARY=$(echo "$LINT_RESULTS" | grep -E 'lint.*' || echo "Uh Oh Something happened :/")
          FORMAT_SUMMARY=$(echo "$FORMAT_RESULTS" | grep -E 'format.*' || echo "uh oh, something happened :/")

          # Prepare comment body
          COMMENT_BODY="## CI Results\n\n"
          COMMENT_BODY+="### Lint Results\n"
          COMMENT_BODY+="\`\`\`\n$LINT_SUMMARY\n\`\`\`\n\n"
          COMMENT_BODY+="### Test Results\n"
          COMMENT_BODY+="\`\`\`\n$TEST_SUMMARY\n\`\`\`\n\n"
          COMMENT_BODY+="### Format Results\n"
          COMMENT_BODY+="\`\`\`\n$FORMAT_SUMMARY\n\`\`\`\n"

          # Save comment body to environment variable
          echo "COMMENT_BODY<<EOF" >> $GITHUB_ENV
          echo "$COMMENT_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post results comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: 'CI Results'
          message: ${{ env.COMMENT_BODY }}
